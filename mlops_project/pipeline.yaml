        \   os.makedirs(os.path.dirname(file_path), exist_ok=True)\n    return file_path\n\
        \ndef select_best_model(\n    cnn_metrics,\n    fnn_metrics,\n    cnn_lstm_metrics,\
        \       \n    selection_result\n):\n    import json\n    import numpy as np\n\
        \n    print(\"=\"*80)\n    print(\"S\xC9LECTION DU MEILLEUR MOD\xC8LE - R\xB2\
        \")\n    print(\"=\"*80)\n\n    # -----------------------------\n    # LOAD\
        \ METRICS\n    # -----------------------------\n    with open(cnn_metrics,\
        \ 'r') as f:\n        cnn = json.load(f)\n    with open(fnn_metrics, 'r')\
        \ as f:\n        fnn = json.load(f)\n    with open(cnn_lstm_metrics, 'r')\
        \ as f:          \n        cnn_lstm = json.load(f)\n\n    features = list(cnn['features'].keys())\n\
        \    print(f\"\\nComparaison sur {len(features)} features\\n\")\n\n    # -----------------------------\n\
        \    # STATS\n    # -----------------------------\n    feature_wins = {'CNN':\
        \ 0, 'FNN': 0, 'CNN-LSTM': 0}       \n    feature_comparison = {}\n\n    print(f\"\
        {'Feature':<20} {'CNN R\xB2':<12} {'FNN R\xB2':<12} {'CNN-LSTM R\xB2':<14}\
        \ {'Diff':<10} {'Winner'}\")\n    print(\"-\"*90)\n\n    for f in features:\n\
        \        cnn_r2      = cnn['features'][f]['r2']\n        fnn_r2      = fnn['features'][f]['r2']\n\
        \        cnn_lstm_r2 = cnn_lstm['features'][f]['r2']            \n\n     \
        \   best_r2 = max(cnn_r2, fnn_r2, cnn_lstm_r2)           \n\n        if best_r2\
        \ == cnn_lstm_r2 and cnn_lstm_r2 > max(cnn_r2, fnn_r2):\n            winner\
        \ = \"CNN-LSTM\"\n            feature_wins['CNN-LSTM'] += 1\n        elif\
        \ cnn_r2 >= fnn_r2 and cnn_r2 >= cnn_lstm_r2:\n            if cnn_r2 == fnn_r2\
        \ == cnn_lstm_r2:\n                winner = \"EQUAL\"\n            else:\n\
        \                winner = \"CNN\"\n                feature_wins['CNN'] +=\
        \ 1\n        elif fnn_r2 >= cnn_r2 and fnn_r2 >= cnn_lstm_r2:\n          \
        \  winner = \"FNN\"\n            feature_wins['FNN'] += 1\n        else:\n\
        \            winner = \"CNN-LSTM\"\n            feature_wins['CNN-LSTM'] +=\
        \ 1\n\n        diff = cnn_lstm_r2 - max(cnn_r2, fnn_r2)               \n\n\
        \        feature_comparison[f] = {\n            \"cnn_r2\":      cnn_r2,\n\
        \            \"fnn_r2\":      fnn_r2,\n            \"cnn_lstm_r2\": cnn_lstm_r2,\n\
        \            \"diff\":        diff,\n            \"winner\":      winner\n\
        \        }\n\n        print(\n            f\"{f:<20} {cnn_r2:<12.4f} {fnn_r2:<12.4f}\
