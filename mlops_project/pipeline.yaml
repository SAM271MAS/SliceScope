          str):\n    import os\n    os.makedirs(os.path.dirname(file_path), exist_ok=True)\n    return
          file_path\n\ndef train_cnn_category(\n    input_json,\n    model_output,\n    metrics_output,\n    plot_output\n):\n    import
          os, json\n    import numpy as np\n    import tensorflow as tf\n    import
          matplotlib\n    matplotlib.use(''Agg'')\n    import matplotlib.pyplot as
