        \n    # V\xE9rifier s'il y a \xE9galit\xE9 sur le R\xB2 moyen\n    tied =\
        \ [m for m, v in avg_scores.items() if v == best_avg]\n\n    if len(tied)\
        \ == 1:\n        reasoning = f\"{best_model} a meilleur R\xB2 moyen ({best_avg:.4f})\"\
        \n    else:\n        # D\xE9partager par nombre de features gagn\xE9es\n \
        \       best_model = max(tied, key=lambda m: feature_wins[m])\n        reasoning\
        \  = f\"\xE9galit\xE9 moyenne mais {best_model} gagne plus de features\"\n\
        \n    print(\"\\n\" + \"=\"*80)\n    print(f\"MEILLEUR MOD\xC8LE: {best_model}\"\
        )\n    print(reasoning)\n    print(\"=\"*80)\n\n    # -----------------------------\n\
        \    # SAVE RESULT\n    # -----------------------------\n    results = {\n\
        \        \"best_model\":    best_model,\n        \"reasoning\":     reasoning,\n\
        \        \"avg_r2\": {\n            \"CNN\":      float(avg_cnn),\n      \
        \      \"FNN\":      float(avg_fnn),\n            \"CNN-LSTM\": float(avg_cnn_lstm)\
        \                     \n        },\n        \"feature_wins\":    feature_wins,\n\
        \        \"total_features\":  len(features),\n        \"feature_comparison\"\
        : feature_comparison,               \n        \"cnn_features\":      cnn[\"\
        features\"],\n        \"fnn_features\":      fnn[\"features\"],\n        \"\
        cnn_lstm_features\": cnn_lstm[\"features\"]              \n    }\n\n    with\
        \ open(selection_result, 'w') as f:\n        json.dump(results, f, indent=2)\n\
        \n    print(\"\\n\u2714 R\xE9sultat sauvegard\xE9\")\n\nimport argparse\n\
        _parser = argparse.ArgumentParser(prog='Select best model', description='')\n\
        _parser.add_argument(\"--cnn-metrics\", dest=\"cnn_metrics\", type=str, required=True,\
