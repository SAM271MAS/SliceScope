          str):\n    import os\n    os.makedirs(os.path.dirname(file_path), exist_ok=True)\n    return
          file_path\n\ndef select_best_model(\n    cnn_metrics,\n    fnn_metrics,\n    cnn_lstm_metrics,       \n    selection_result\n):\n    import
          json\n    import numpy as np\n\n    print(\"=\"*80)\n    print(\"S\u00c9LECTION
          DU MEILLEUR MOD\u00c8LE - R\u00b2\")\n    print(\"=\"*80)\n\n    # -----------------------------\n    #
          LOAD METRICS\n    # -----------------------------\n    with open(cnn_metrics,
          ''r'') as f:\n        cnn = json.load(f)\n    with open(fnn_metrics, ''r'')
          as f:\n        fnn = json.load(f)\n    with open(cnn_lstm_metrics, ''r'')
          as f:          \n        cnn_lstm = json.load(f)\n\n    features = list(cnn[''features''].keys())\n    print(f\"\\nComparaison
          sur {len(features)} features\\n\")\n\n    # -----------------------------\n    #
          STATS\n    # -----------------------------\n    feature_wins = {''CNN'':
          0, ''FNN'': 0, ''CNN-LSTM'': 0}       \n    feature_comparison = {}\n\n    print(f\"{''Feature'':<20}
          {''CNN R\u00b2'':<12} {''FNN R\u00b2'':<12} {''CNN-LSTM R\u00b2'':<14} {''Diff'':<10}
          {''Winner''}\")\n    print(\"-\"*90)\n\n    for f in features:\n        cnn_r2      =
          cnn[''features''][f][''r2'']\n        fnn_r2      = fnn[''features''][f][''r2'']\n        cnn_lstm_r2
          = cnn_lstm[''features''][f][''r2'']            \n\n        best_r2 = max(cnn_r2,
          fnn_r2, cnn_lstm_r2)           \n\n        if best_r2 == cnn_lstm_r2 and
          cnn_lstm_r2 > max(cnn_r2, fnn_r2):\n            winner = \"CNN-LSTM\"\n            feature_wins[''CNN-LSTM'']
          += 1\n        elif cnn_r2 >= fnn_r2 and cnn_r2 >= cnn_lstm_r2:\n            if
          cnn_r2 == fnn_r2 == cnn_lstm_r2:\n                winner = \"EQUAL\"\n            else:\n                winner
          = \"CNN\"\n                feature_wins[''CNN''] += 1\n        elif fnn_r2
          >= cnn_r2 and fnn_r2 >= cnn_lstm_r2:\n            winner = \"FNN\"\n            feature_wins[''FNN'']
          += 1\n        else:\n            winner = \"CNN-LSTM\"\n            feature_wins[''CNN-LSTM'']
          += 1\n\n        diff = cnn_lstm_r2 - max(cnn_r2, fnn_r2)               \n\n        feature_comparison[f]
          = {\n            \"cnn_r2\":      cnn_r2,\n            \"fnn_r2\":      fnn_r2,\n            \"cnn_lstm_r2\":
          cnn_lstm_r2,\n            \"diff\":        diff,\n            \"winner\":      winner\n        }\n\n        print(\n            f\"{f:<20}
          {cnn_r2:<12.4f} {fnn_r2:<12.4f} \"\n            f\"{cnn_lstm_r2:<14.4f}
          {diff:<+10.4f} {winner}\"\n        )\n\n    # -----------------------------\n    #
          AVERAGE R2\n    # -----------------------------\n    avg_cnn      = np.mean([cnn[''features''][f][''r2'']      for
          f in features])\n    avg_fnn      = np.mean([fnn[''features''][f][''r2'']      for
          f in features])\n    avg_cnn_lstm = np.mean([cnn_lstm[''features''][f][''r2'']
          for f in features])  \n\n    print(\"\\n\" + \"=\"*80)\n    print(\"R\u00c9SUM\u00c9\")\n    print(\"=\"*80)\n    print(f\"CNN
          R\u00b2 moyen:      {avg_cnn:.4f}\")\n    print(f\"FNN R\u00b2 moyen:      {avg_fnn:.4f}\")\n    print(f\"CNN-LSTM
          R\u00b2 moyen: {avg_cnn_lstm:.4f}\")            \n\n    # -----------------------------\n    #
          DECISION\n    # -----------------------------\n    avg_scores = {''CNN'':
          avg_cnn, ''FNN'': avg_fnn, ''CNN-LSTM'': avg_cnn_lstm}   \n    best_model
          = max(avg_scores, key=avg_scores.get)\n    best_avg   = avg_scores[best_model]\n\n    #
          V\u00e9rifier s''il y a \u00e9galit\u00e9 sur le R\u00b2 moyen\n    tied
          = [m for m, v in avg_scores.items() if v == best_avg]\n\n    if len(tied)
          == 1:\n        reasoning = f\"{best_model} a meilleur R\u00b2 moyen ({best_avg:.4f})\"\n    else:\n        #
          D\u00e9partager par nombre de features gagn\u00e9es\n        best_model
          = max(tied, key=lambda m: feature_wins[m])\n        reasoning  = f\"\u00e9galit\u00e9
          moyenne mais {best_model} gagne plus de features\"\n\n    print(\"\\n\"
          + \"=\"*80)\n    print(f\"MEILLEUR MOD\u00c8LE: {best_model}\")\n    print(reasoning)\n    print(\"=\"*80)\n\n    #
          -----------------------------\n    # SAVE RESULT\n    # -----------------------------\n    results
          = {\n        \"best_model\":    best_model,\n        \"reasoning\":     reasoning,\n        \"avg_r2\":
          {\n            \"CNN\":      float(avg_cnn),\n            \"FNN\":      float(avg_fnn),\n            \"CNN-LSTM\":
          float(avg_cnn_lstm)                     \n        },\n        \"feature_wins\":    feature_wins,\n        \"total_features\":  len(features),\n        \"feature_comparison\":
          feature_comparison,               \n        \"cnn_features\":      cnn[\"features\"],\n        \"fnn_features\":      fnn[\"features\"],\n        \"cnn_lstm_features\":
          cnn_lstm[\"features\"]              \n    }\n\n    with open(selection_result,
          ''w'') as f:\n        json.dump(results, f, indent=2)\n\n    print(\"\\n\u2714
          R\u00e9sultat sauvegard\u00e9\")\n\nimport argparse\n_parser = argparse.ArgumentParser(prog=''Select
          best model'', description='''')\n_parser.add_argument(\"--cnn-metrics\",
          dest=\"cnn_metrics\", type=str, required=True, default=argparse.SUPPRESS)\n_parser.add_argument(\"--fnn-metrics\",
          dest=\"fnn_metrics\", type=str, required=True, default=argparse.SUPPRESS)\n_parser.add_argument(\"--cnn-lstm-metrics\",
          dest=\"cnn_lstm_metrics\", type=str, required=True, default=argparse.SUPPRESS)\n_parser.add_argument(\"--selection-result\",
          dest=\"selection_result\", type=_make_parent_dirs_and_return_path, required=True,
          default=argparse.SUPPRESS)\n_parsed_args = vars(_parser.parse_args())\n\n_outputs
          = select_best_model(**_parsed_args)\n"], "image": "tibermac/mlops-pipeline:latest"}},
          "inputs": [{"name": "cnn_metrics", "type": "String"}, {"name": "fnn_metrics",
          "type": "String"}, {"name": "cnn_lstm_metrics", "type": "String"}], "name":
          "Select best model", "outputs": [{"name": "selection_result", "type": "String"}]}',
        pipelines.kubeflow.org/component_ref: '{}'}
  - name: train-cnn-category
    container:
      args: [--input-json, /tmp/inputs/input_json/data, --model-output, /tmp/outputs/model_output/data,
        --metrics-output, /tmp/outputs/metrics_output/data, --plot-output, /tmp/outputs/plot_output/data]
