          model\n\n    model = build_fnn_model(\n        input_shape=(X_train.shape[1],
          X_train.shape[2]),\n        output_dim=y_train.shape[1]\n    )\n\n    #
          Afficher le r\u00e9sum\u00e9\n    model.summary()\n\n    # --- Entra\u00eenement
          ---\n\n    history_fnn_agg = train_model_wrapper(model, ''fnn'', X_train,
          y_train, X_val, y_val, epochs=60, optimized=True)\n\n    # --- Visualisation
          ---\n    def plot_training_history(history, model_name, plot_output_path):\n        \"\"\"\n        Plots
          the training and validation Loss and Tolerance Accuracy in separate figures\n        \"\"\"\n        #
          Plot Loss (MSE)\n        os.makedirs(plot_output_path, exist_ok=True)\n        fig1,
