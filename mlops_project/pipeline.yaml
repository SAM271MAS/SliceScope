  templates:
  - name: evaluate
    container:
      args: [--data-input, /tmp/inputs/data_input/data, --model-input, /tmp/inputs/model_input/data,
        --output-data, /tmp/outputs/output_data/data, --plot-output, /tmp/outputs/plot_output/data,
        --test-metrics, /tmp/outputs/test_metrics/data]
      command:
      - sh
