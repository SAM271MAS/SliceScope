          import EarlyStopping, ReduceLROnPlateau\n    from tensorflow.keras.metrics
          import RootMeanSquaredError\n    from tensorflow.keras import backend as
          K\n\n    os.environ[\"TF_CPP_MIN_LOG_LEVEL\"] = \"2\"\n\n    tf.random.set_seed(42)\n    np.random.seed(42)\n\n    print(\"D\u00e9but
          de l''entra\u00eenement...\")\n\n    # --- Load data info ---\n    data
          = np.load(input_json)\n\n    X_train = data[\"X_train\"]\n    y_train =
