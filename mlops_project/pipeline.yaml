          linestyle='':'', alpha=0.5, color=''gray'')\n\n            plt.tight_layout()\n            acc_plot_path
          = os.path.join(plot_output_path, f''Accuracy_{model_name.replace(\"-\",
          \"_\")}.pdf'')\n            plt.savefig(acc_plot_path, format=''pdf'', bbox_inches=''tight'')\n            plt.close()\n\n    #
          Sauvegarder les plots\n    plots_dir = os.path.join(plot_output, \"plots\")\n    plot_training_history(history_fnn_agg,
          \"FNN_Model_aggregated\", plots_dir)\n\n    os.makedirs(model_output, exist_ok=True)\n\n    model_filename
          = f\"fnn_model_h{horizon}.keras\"\n    model_path = os.path.join(model_output,
