          = train_dataset.cache().batch(batch_size).prefetch(tf.data.AUTOTUNE)\n\n        val_dataset
          = tf.data.Dataset.from_tensor_slices((X_val, y_val))\n        val_dataset
          = val_dataset.cache().batch(batch_size).prefetch(tf.data.AUTOTUNE)\n\n        #
          Configure Callbacks\n        early_stop = EarlyStopping(\n            monitor=''val_loss'',\n            patience=patience_scale,       #
