          ''FNN'',\n        ''horizon'': horizon,\n        ''final_train_loss'': float(history_fnn_agg.history[''loss''][-1]),\n        ''final_val_loss'':
          float(history_fnn_agg.history[''val_loss''][-1]),\n        ''best_val_loss'':
          float(min(history_fnn_agg.history[''val_loss''])),\n        ''best_epoch'':
