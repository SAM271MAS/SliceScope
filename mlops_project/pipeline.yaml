          Revert to the best epoch automatically\n            verbose=1\n        )\n\n        reduce_lr
          = ReduceLROnPlateau(\n            monitor=''val_loss'',\n            factor=0.5,                    #
          Cut learning rate in half if plateaued\n            patience=patience_scale
          // 2,  # Trigger LR reduction before Early Stopping kicks in\n            min_lr=1e-6,\n            verbose=1\n        )\n\n        #
          Train the Model using the pipeline\n        history = model.fit(\n            train_dataset,\n            validation_data=val_dataset,\n            epochs=max_epochs,\n            callbacks=[early_stop,
