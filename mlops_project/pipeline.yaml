          = int(data[\"horizon\"])\n\n    print(f\"X_train: {X_train.shape}\")\n    print(f\"y_train:
          {y_train.shape}\")\n    print(f\"X_val: {X_val.shape}\")\n    print(f\"y_val:
          {y_val.shape}\")\n\n    # --- D\u00e9finir les m\u00e9triques ---\n    def
          tolerance_accuracy(y_true, y_pred, tol=0.15):\n        \"\"\"\n        Calculates
          the percentage of predictions that fall within a (tol) tolerance\n        of
          the actual values.\n        \"\"\"\n        y_true = tf.cast(y_true, tf.float32)\n        y_pred
          = tf.cast(y_pred, tf.float32)\n\n        epsilon = K.epsilon()\n\n        absolute_error
          = tf.abs(y_pred - y_true)\n        relative_error = absolute_error / (tf.abs(y_true)
          + epsilon)\n\n        within_tolerance = tf.less(relative_error, tol)\n        accuracy
          = tf.reduce_mean(tf.cast(within_tolerance, tf.float32))\n\n        return
          accuracy\n\n    # --- Configuration des epochs ---\n    EPOCH_LIMITS = {\n        ''fnn'':
          60,\n        ''cnn'': 60,\n        ''lstm'': 60,\n        ''gru'': 60,\n        ''bi-lstm'':
          60,\n        ''cnn-lstm'': 60\n    }\n\n    def train_optimized_model(model,
