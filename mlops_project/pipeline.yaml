      - "def _make_parent_dirs_and_return_path(file_path: str):\n    import os\n \
        \   os.makedirs(os.path.dirname(file_path), exist_ok=True)\n    return file_path\n\
        \ndef train_cnn_category(\n    input_json,\n    model_output,\n    metrics_output,\n\
        \    plot_output\n):\n    import os, json\n    import numpy as np\n    import\
        \ tensorflow as tf\n    import matplotlib\n    matplotlib.use('Agg')\n   \
        \ import matplotlib.pyplot as plt\n    from datetime import datetime\n   \
        \ from sklearn.metrics import r2_score\n    from tensorflow.keras.models import\
        \ Sequential\n    from tensorflow.keras.layers import Dense, Flatten, Input,Conv1D,\
        \ MaxPooling1D\n    from tensorflow.keras.callbacks import EarlyStopping,\
        \ ReduceLROnPlateau\n    from tensorflow.keras.metrics import RootMeanSquaredError\n\
        \    from tensorflow.keras import backend as K\n\n    os.environ[\"TF_CPP_MIN_LOG_LEVEL\"\
        ] = \"2\"\n\n    tf.random.set_seed(42)\n    np.random.seed(42)\n\n    print(\"\
        D\xE9but de l'entra\xEEnement...\")\n\n    # --- Load data info ---\n    data\
        \ = np.load(input_json)\n\n    X_train = data[\"X_train\"]\n    y_train =\
        \ data[\"y_train\"]\n    X_val = data[\"X_val\"]\n    y_val = data[\"y_val\"\
        ]\n    horizon = int(data[\"horizon\"])\n\n    print(f\"X_train: {X_train.shape}\"\
        )\n    print(f\"y_train: {y_train.shape}\")\n    print(f\"X_val: {X_val.shape}\"\
        )\n    print(f\"y_val: {y_val.shape}\")\n\n    # --- D\xE9finir les m\xE9\
        triques ---\n    def tolerance_accuracy(y_true, y_pred, tol=0.15):\n     \
        \   \"\"\"\n        Calculates the percentage of predictions that fall within\
        \ a (tol) tolerance\n        of the actual values.\n        \"\"\"\n     \
        \   y_true = tf.cast(y_true, tf.float32)\n        y_pred = tf.cast(y_pred,\
        \ tf.float32)\n\n        epsilon = K.epsilon()\n\n        absolute_error =\
        \ tf.abs(y_pred - y_true)\n        relative_error = absolute_error / (tf.abs(y_true)\
        \ + epsilon)\n\n        within_tolerance = tf.less(relative_error, tol)\n\
        \        accuracy = tf.reduce_mean(tf.cast(within_tolerance, tf.float32))\n\
        \n        return accuracy\n\n    # --- Configuration des epochs ---\n    EPOCH_LIMITS\
        \ = {\n        'fnn': 60,\n        'cnn': 60,\n        'lstm': 60,\n     \
        \   'gru': 60,\n        'bi-lstm': 60,\n        'cnn-lstm': 60\n    }\n\n\
        \    def train_optimized_model(model, model_name, X_train, y_train, X_val,\
        \ y_val, batch_size=64):\n        \"\"\"\n        Trains a model using tf.data\
        \ pipelines, dynamic learning rates, and early stopping.\n        Enforces\
        \ the maximum epochs defined in the reference paper.\n        \"\"\"\n   \
        \     max_epochs = EPOCH_LIMITS.get(model_name.lower(), 100)\n\n        #\
        \ Calculate a dynamic patience scale (20% of max epochs, minimum of 3)\n \
        \       patience_scale = max(3, max_epochs // 20)\n\n        # Build High-Speed\
        \ tf.data Pipelines\n        # .cache() keeps data in memory, .prefetch()\
        \ loads next batch while GPU trains\n        train_dataset = tf.data.Dataset.from_tensor_slices((X_train,\
        \ y_train))\n        train_dataset = train_dataset.cache().batch(batch_size).prefetch(tf.data.AUTOTUNE)\n\
        \n        val_dataset = tf.data.Dataset.from_tensor_slices((X_val, y_val))\n\
        \        val_dataset = val_dataset.cache().batch(batch_size).prefetch(tf.data.AUTOTUNE)\n\
        \n        # Configure Callbacks\n        early_stop = EarlyStopping(\n   \
        \         monitor='val_loss',\n            patience=patience_scale,      \
        \ # Wait dynamically based on model\n            restore_best_weights=True,\
        \     # Revert to the best epoch automatically\n            verbose=1\n  \
        \      )\n\n        reduce_lr = ReduceLROnPlateau(\n            monitor='val_loss',\n\
        \            factor=0.5,                    # Cut learning rate in half if\
        \ plateaued\n            patience=patience_scale // 2,  # Trigger LR reduction\
        \ before Early Stopping kicks in\n            min_lr=1e-6,\n            verbose=1\n\
        \        )\n\n        # Train the Model using the pipeline\n        history\
        \ = model.fit(\n            train_dataset,\n            validation_data=val_dataset,\n\
        \            epochs=max_epochs,\n            callbacks=[early_stop, reduce_lr],\n\
        \            verbose=2 # Cleaner console output for hundreds of epochs\n \
        \       )\n\n        return history\n\n    def train_model_wrapper(model,\
        \ model_name, X_train, y_train, X_val, y_val, epochs, batch_size=64, optimized=True):\n\
        \        \"\"\"\n        Toggles between standard Keras .fit() and the optimized\
        \ tf.data pipeline.\n        \"\"\"\n        if optimized:\n            print(f\"\
        --- Training {model_name.upper()} (Optimized Pipeline) ---\")\n          \
        \  history = train_optimized_model(\n                model=model,\n      \
        \          model_name=model_name,\n                X_train=X_train,\n    \
        \            y_train=y_train,\n                X_val=X_val,\n            \
        \    y_val=y_val,\n                batch_size=batch_size\n            )\n\
        \        else:\n            print(f\"--- Training {model_name.upper()} (Standard\
        \ .fit) ---\")\n            history = model.fit(\n                X_train,\
        \ y_train,\n                validation_data=(X_val, y_val),\n            \
        \    epochs=epochs,\n                batch_size=batch_size,\n            \
        \    verbose=1\n            )\n        return history\n\n    def build_cnn_model(input_shape,\
        \ output_dim):\n        model = Sequential()\n\n        # Input layer\n  \
        \      model.add(Input(shape=input_shape))\n\n        # 1D Convolutional Layer\
        \ (64 filters, kernel size 2)\n        model.add(Conv1D(filters=64, kernel_size=2,\
        \ activation='relu'))\n\n        # Max Pooling Layer (pool size 2)\n     \
        \   model.add(MaxPooling1D(pool_size=2))\n\n        # Flatten to transition\
        \ from 3D to 2D\n        model.add(Flatten())\n\n        # Fully Connected\
        \ Hidden Layer (50 units)\n        model.add(Dense(50, activation='relu'))\n\
        \n        # Output layer\n        model.add(Dense(output_dim, activation='linear'))\n\
        \n        model.compile(\n            optimizer='adam',\n            loss='mse',\n\
        \            metrics=[\n                'mae',\n                RootMeanSquaredError(name='rmse'),\n\
        \                tolerance_accuracy\n            ]\n        )\n\n        return\
        \ model\n\n    model = build_cnn_model(\n        input_shape=(X_train.shape[1],\
        \ X_train.shape[2]),\n        output_dim=y_train.shape[1]\n    )\n\n    #\
        \ Afficher le r\xE9sum\xE9\n    model.summary()\n\n    # --- Entra\xEEnement\
        \ ---\n\n    history_cnn_agg = train_model_wrapper(model, 'cnn', X_train,\
        \ y_train, X_val, y_val, epochs=60, optimized=True)\n\n    # --- Visualisation\
        \ ---\n    def plot_training_history(history, model_name, plot_output_path):\n\
        \        \"\"\"\n        Plots the training and validation Loss and Tolerance\
        \ Accuracy in separate figures\n        \"\"\"\n        # Plot Loss (MSE)\n\
        \        os.makedirs(plot_output_path, exist_ok=True)\n        fig1, ax1 =\
        \ plt.subplots(figsize=(3.5, 2.5))\n\n        ax1.plot(history.history['loss'],\
        \ label='Train Loss', color='blue', linewidth=1.2)\n        ax1.plot(history.history['val_loss'],\
        \ label='Val Loss', color='red', linestyle='--', linewidth=1.2)\n\n      \
        \  ax1.set_xlabel('Epochs', fontsize=8)\n        ax1.set_ylabel('Loss (MSE)',\
        \ fontsize=8)\n        ax1.tick_params(axis='both', labelsize=8)\n       \
        \ ax1.legend(fontsize=8, frameon=False)\n        ax1.grid(True, linestyle=':',\
        \ alpha=0.5, color='gray')\n\n        plt.tight_layout()\n        loss_plot_path\
        \ = os.path.join(plot_output_path, f'Loss_{model_name.replace(\"-\", \"_\"\
        )}.pdf')\n        plt.savefig(loss_plot_path, format='pdf', bbox_inches='tight')\n\
        \        plt.close()\n\n        # Plot Custom Metric (Tolerance Accuracy)\n\
        \        fig2, ax2 = plt.subplots(figsize=(3.5, 2.5))\n\n        if 'tolerance_accuracy'\
        \ in history.history:\n            ax2.plot(history.history['tolerance_accuracy'],\
        \ label='Train Acc', color='blue', linewidth=1.2)\n            ax2.plot(history.history['val_tolerance_accuracy'],\
        \ label='Val Acc', color='red', linestyle='--', linewidth=1.2)\n\n       \
        \     ax2.set_xlabel('Epochs', fontsize=8)\n            ax2.set_ylabel('Tol.\
        \ Accuracy', fontsize=8)\n            ax2.tick_params(axis='both', labelsize=8)\n\
        \            ax2.legend(fontsize=8, frameon=False)\n            ax2.grid(True,\
        \ linestyle=':', alpha=0.5, color='gray')\n\n            plt.tight_layout()\n\
        \            acc_plot_path = os.path.join(plot_output_path, f'Accuracy_{model_name.replace(\"\
        -\", \"_\")}.pdf')\n            plt.savefig(acc_plot_path, format='pdf', bbox_inches='tight')\n\
        \            plt.close()\n\n    # Sauvegarder les plots\n    plots_dir = os.path.join(plot_output,\
        \ \"plots\")\n    plot_training_history(history_cnn_agg, \"CNN_Model_aggregated\"\
        , plots_dir)\n\n    os.makedirs(model_output, exist_ok=True)\n\n    model_filename\
        \ = f\"cnn_model_h{horizon}.keras\"\n    model_path = os.path.join(model_output,\
        \ model_filename)\n\n    model.save(model_path)\n\n    print(f\" Mod\xE8le\
        \ sauvegard\xE9: {model_path}\")\n\n    # --- Pr\xE9dictions ---\n    y_pred\
        \ = model.predict(X_val)\n\n    # --- M\xE9triques ---\n    metrics = {\n\
        \        'model_name': 'CNN',\n        'horizon': horizon,\n        'final_train_loss':\
        \ float(history_cnn_agg.history['loss'][-1]),\n        'final_val_loss': float(history_cnn_agg.history['val_loss'][-1]),\n\
        \        'best_val_loss': float(min(history_cnn_agg.history['val_loss'])),\n\
        \        'best_epoch': int(np.argmin(history_cnn_agg.history['val_loss'])),\n\
        \        'final_val_mae': float(history_cnn_agg.history['val_mae'][-1]),\n\
        \        'final_val_rmse': float(history_cnn_agg.history['val_rmse'][-1]),\n\
        \        'final_val_tolerance_acc': float(history_cnn_agg.history['val_tolerance_accuracy'][-1]),\n\
        \        'r2_score': float(r2_score(y_val.flatten(), y_pred.flatten())),\n\
        \        'epochs_trained': len(history_cnn_agg.history['loss']),\n       \
        \ 'training_completed': datetime.now().isoformat()\n    }\n\n    # --- Sauvegarde\
        \ metrics ---\n    with open(metrics_output, 'w') as f:\n        json.dump(metrics,\
        \ f, indent=2)\n\n    print(\"\\n --- M\xE9triques finales ---\")\n    for\
        \ key, value in metrics.items():\n        print(f\"{key}: {value}\")\n\n \
        \   print(\" Entra\xEEnement termin\xE9 avec succ\xE8s !\")\n\nimport argparse\n\
        _parser = argparse.ArgumentParser(prog='Train cnn category', description='')\n\
        _parser.add_argument(\"--input-json\", dest=\"input_json\", type=str, required=True,\
        \ default=argparse.SUPPRESS)\n_parser.add_argument(\"--model-output\", dest=\"\
        model_output\", type=_make_parent_dirs_and_return_path, required=True, default=argparse.SUPPRESS)\n\
        _parser.add_argument(\"--metrics-output\", dest=\"metrics_output\", type=_make_parent_dirs_and_return_path,\
        \ required=True, default=argparse.SUPPRESS)\n_parser.add_argument(\"--plot-output\"\
        , dest=\"plot_output\", type=_make_parent_dirs_and_return_path, required=True,\
        \ default=argparse.SUPPRESS)\n_parsed_args = vars(_parser.parse_args())\n\n\
        _outputs = train_cnn_category(**_parsed_args)\n"
      image: tibermac/mlops-pipeline:latest
    inputs:
      artifacts:
      - {name: preprocess-output, path: /tmp/inputs/input_json/data}
    outputs:
      artifacts:
