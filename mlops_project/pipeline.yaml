      - |
        program_path=$(mktemp)
        printf "%s" "$0" > "$program_path"
        python3 -u "$program_path" "$@"
      - "def _make_parent_dirs_and_return_path(file_path: str):\n    import os\n \
        \   os.makedirs(os.path.dirname(file_path), exist_ok=True)\n    return file_path\n\
        \ndef evaluate(\n    data_input,\n    model_input,\n    output_data,\n   \
        \ plot_output,\n    test_metrics\n):\n    import os\n    import json\n   \
        \ import numpy as np\n    import tensorflow as tf\n    import matplotlib\n\
        \    matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n    import\
        \ joblib\n    import tempfile\n\n    from sklearn.metrics import mean_squared_error,\
        \ mean_absolute_error, r2_score\n\n    print(\"=== D\xE9but \xE9valuation\
        \ ===\")\n\n    # -----------------------------\n    # LOAD DATA\n    # -----------------------------\n\
        \    data = np.load(data_input, allow_pickle=True)\n\n    X_test  = data[\"\
        X_test\"]\n    y_test  = data[\"y_test\"]\n    horizon = int(data[\"horizon\"\
        ])\n    FEATURES = data[\"feature_names\"]\n\n    # -----------------------------\n\
        \    # LOAD MODEL\n    # -----------------------------\n    model_files =\
        \ os.listdir(model_input)\n    model_path  = os.path.join(model_input, model_files[0])\n\
        \    model       = tf.keras.models.load_model(model_path, compile=False)\n\
        \n    # -----------------------------\n    # DETECT MODEL NAME           \n\
        \    # -----------------------------\n    def detect_model_name(path):\n \
        \       p = path.lower()\n        if \"cnn-lstm\" in p:\n            return\
        \ \"CNN-LSTM\"\n        elif \"cnn\" in p:\n            return \"CNN\"\n \
        \       elif \"fnn\" in p:\n            return \"FNN\"\n\n    model_name =\
        \ detect_model_name(model_path)\n    print(f\"Mod\xE8le d\xE9tect\xE9 : {model_name}\"\
        )\n\n    # -----------------------------\n    # PREDICTION\n    # -----------------------------\n\
        \    y_pred = model.predict(X_test)\n\n    # -----------------------------\n\
        \    # LOAD SCALER\n    # -----------------------------\n    scaler_bytes\
        \ = data[\"scaler\"].item()\n\n    tmp_scaler = tempfile.mktemp(suffix=\"\
        .save\")\n    with open(tmp_scaler, \"wb\") as f:\n        f.write(scaler_bytes)\n\
        \n    scaler = joblib.load(tmp_scaler)\n    os.remove(tmp_scaler)\n\n    #\
        \ -----------------------------\n    # INVERSE TRANSFORM\n    # -----------------------------\n\
        \    y_test_unscaled = scaler.inverse_transform(y_test)\n    y_pred_unscaled\
        \ = scaler.inverse_transform(y_pred)\n\n    # -----------------------------\n\
        \    # FEATURE TYPES\n    # -----------------------------\n    feature_types\
        \ = {}\n    for f in FEATURES:\n        if \"Jitter\" in f:\n            feature_types[f]\
        \ = \"jitter\"\n        elif \"CQI\" in f:\n            feature_types[f] =\
        \ \"cqi\"\n        else:\n            feature_types[f] = \"throughput\"\n\n\
        \    # -----------------------------\n    # METRICS FUNCTIONS\n    # -----------------------------\n\
        \    def calculate_metrics(y_true, y_pred):\n        rmse = np.sqrt(mean_squared_error(y_true,\
        \ y_pred))\n        mae  = mean_absolute_error(y_true, y_pred)\n        r2\
        \   = r2_score(y_true, y_pred)\n        return {\n            \"rmse\": float(rmse),\n\
        \            \"mae\":  float(mae),\n            \"r2\":   float(r2),\n   \
        \     }\n\n    # -----------------------------\n    # METRICS PER FEATURE\n\
        \    # -----------------------------\n    all_metrics = {}\n\n    print(\"\
        \\n\" + \"=\" * 80)\n    print(\"M\xC9TRIQUES PAR FEATURE\")\n    print(\"\
        =\" * 80)\n    print(f\"{'Feature':<20} {'RMSE':<10} {'MAE':<10} {'R2':<8}\"\
        )\n    print(\"-\" * 70)\n\n    for i, feature in enumerate(FEATURES):\n \
        \       if i >= y_test_unscaled.shape[1]:\n            break\n\n        y_true_f\
        \ = y_test_unscaled[:, i]\n        y_pred_f = y_pred_unscaled[:, i]\n\n  \
        \      metrics = calculate_metrics(y_true_f, y_pred_f)\n        all_metrics[feature]\
        \ = metrics\n\n        print(\n            f\"{feature:<20} \"\n         \
        \   f\"{metrics['rmse']:<10.4f} \"\n            f\"{metrics['mae']:<10.4f}\
        \ \"\n            f\"{metrics['r2']:<8.4f}\"\n        )\n\n    # -----------------------------\n\
        \    # SAVE METRICS\n    # -----------------------------\n    with open(test_metrics,\
        \ \"w\") as f:\n        json.dump({\n            \"model_name\": model_name,\n\
        \            \"horizon\":    horizon,\n            \"features\":   all_metrics\n\
        \        }, f, indent=2)\n\n    # -----------------------------\n    # PLOT\
        \ FUNCTION\n    # -----------------------------\n    def plot_feature(actual,\
        \ predicted, feature_name, metrics, horizon):\n        fig, ax = plt.subplots(figsize=(10,\
        \ 4))\n\n        steps = min(200, len(actual))\n        t     = range(steps)\n\
        \n        ax.plot(t, actual[:steps],    label=\"Actual\",    linewidth=1.5)\n\
        \        ax.plot(t, predicted[:steps], label=\"Predicted\", linestyle=\"--\"\
        , linewidth=1.5)\n\n        if \"web\" in feature_name or \"sipp\" in feature_name:\n\
        \            ylabel = \"Throughput (Kbps)\"\n        elif \"Jitter\" in feature_name:\n\
        \            ylabel = \"Jitter (ms)\"\n        elif \"CQI\" in feature_name:\n\
        \            ylabel = \"CQI\"\n        else:\n            ylabel = \"Value\"\
        \n\n        ax.set_xlabel(\"Time Slots\")\n        ax.set_ylabel(ylabel)\n\
        \        ax.set_title(\n            f\"[{model_name}] {feature_name}\\n\"\
        \   \n            f\"MAE={metrics['mae']:.3f}\"\n        )\n        ax.legend()\n\
        \        ax.grid(True, alpha=0.3)\n        plt.tight_layout()\n\n        safe\
        \ = feature_name.replace(\":\", \"\").replace(\" \", \"_\")\n        plt.savefig(os.path.join(plot_output,\
        \ f\"{model_name}_h{horizon}_{safe}.pdf\"))  \n        plt.close()\n\n   \
        \ # -----------------------------\n    # CREATE PLOTS\n    # -----------------------------\n\
        \    os.makedirs(plot_output, exist_ok=True)\n\n    for i, feature in enumerate(FEATURES):\n\
        \        if i < y_test_unscaled.shape[1]:\n            plot_feature(\n   \
        \             y_test_unscaled[:, i],\n                y_pred_unscaled[:, i],\n\
        \                feature,\n                all_metrics[feature],\n       \
        \         horizon\n            )\n\n    # -----------------------------\n\
        \    # SAVE PREDICTIONS\n    # -----------------------------\n    with open(output_data,\
        \ \"wb\") as f:\n        np.savez_compressed(\n            f,\n          \
        \  y_pred=y_pred_unscaled,\n            y_true=y_test_unscaled,\n        \
        \    feature_names=FEATURES\n        )\n\n    print(f\"\\n\u2714 {len(FEATURES)}\
        \ features \xE9valu\xE9es\")\n    print(\"=== Fin \xE9valuation ===\")\n\n\
        import argparse\n_parser = argparse.ArgumentParser(prog='Evaluate', description='')\n\
        _parser.add_argument(\"--data-input\", dest=\"data_input\", type=str, required=True,\
        \ default=argparse.SUPPRESS)\n_parser.add_argument(\"--model-input\", dest=\"\
        model_input\", type=str, required=True, default=argparse.SUPPRESS)\n_parser.add_argument(\"\
        --output-data\", dest=\"output_data\", type=_make_parent_dirs_and_return_path,\
        \ required=True, default=argparse.SUPPRESS)\n_parser.add_argument(\"--plot-output\"\
        , dest=\"plot_output\", type=_make_parent_dirs_and_return_path, required=True,\
        \ default=argparse.SUPPRESS)\n_parser.add_argument(\"--test-metrics\", dest=\"\
        test_metrics\", type=_make_parent_dirs_and_return_path, required=True, default=argparse.SUPPRESS)\n\
        _parsed_args = vars(_parser.parse_args())\n\n_outputs = evaluate(**_parsed_args)\n"
      image: tibermac/mlops-pipeline:latest
