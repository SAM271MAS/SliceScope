          Training {model_name.upper()} (Standard .fit) ---\")\n            history
          = model.fit(\n                X_train, y_train,\n                validation_data=(X_val,
          y_val),\n                epochs=epochs,\n                batch_size=batch_size,\n                verbose=1\n            )\n        return
