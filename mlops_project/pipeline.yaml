          label=''Val Acc'', color=''red'', linestyle=''--'', linewidth=1.2)\n\n            ax2.set_xlabel(''Epochs'',
          fontsize=8)\n            ax2.set_ylabel(''Tol. Accuracy'', fontsize=8)\n            ax2.tick_params(axis=''both'',
